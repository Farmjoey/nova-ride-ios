:root{--bg:#000;--card:#121214;--card2:#1c1c20;--line:#26262c;--fg:#f4f4f6;--mut:#8d8d98;--acc:#ff7a1a;--onacc:#140800;--ok:#2bd96b;--warn:#ffb000;--bad:#ff3b3b;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.4 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.16em;font-size:16px}.logo b{color:var(--acc)}
#pill{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--card2);color:var(--mut);display:flex;align-items:center;gap:6px}
#pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}

// ---------- firmware update ----------
function checkFile(u8,name){
  if(!/\.bin$/i.test(name))return 'Filen skal være en .bin';
  if(u8.length<MINAPP||u8.length>MAXAPP)return 'Størrelsen skal være mellem 64 KB og '+(MAXAPP/1024)+' KB (er '+Math.round(u8.length/1024)+' KB)';
  if(u8[0]!==0xE9)return 'Det ligner ikke en firmware (.bin). Brug NOVA_RIDE_m5sticks3.bin – ikke .factory.bin';
  if((u8[12]|(u8[13]<<8))!==CHIP_ID)return 'Filen er til en anden chip ('+(u8[12]===0&&u8[13]===0?'ESP32 / det gamle CYD-board':'chip '+u8[12])+'). StickS3 kræver en ESP32-S3-firmware.';
  return '';
}
async function pickFile(f){
  S.file=null;S.fileInfo=null;S.msg='';
  if(!f){render();return}
  var u8=new Uint8Array(await f.arrayBuffer()),bad=checkFile(u8,f.name);
  S.fileInfo={name:f.name,size:u8.length,crc:crc32(u8),bad:bad};
  S.file=bad?null:u8;
  render();
}
async function startUpdate(){
  if(overBle()){S.msg='Firmwareopdatering kræver Wi-Fi. Gå på stick\'ens Wi-Fi (QR-koden i MENU → PHONE APP) og åbn appen derfra.';render();return}
  if(!S.file||!S.conn)return;
  S.busy=true;S.msg='';S.ota={state:0,err:0,recv:0,total:S.file.length};S.t0=Date.now();render();
  try{
    await S.t.ctrl([OP.BEGIN].concat(le32(S.file.length),le32(S.fileInfo.crc)));
    if(S.ota.state!==2&&S.ota.state!==5)await waitOta(5000);          // over Wi-Fi the answer is already here
    if(S.ota.state!==2)throw new Error(ERR[S.ota.err]||'Stick\'en startede ikke opdateringen');
    var CH=S.t.chunk||160,sent=0,u=S.file;
    while(sent<u.length){
      if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på stick\'en');
      var end=Math.min(u.length,sent+CH);
      await S.t.data(u.slice(sent,end));
      sent=end;
    }
    var t0=Date.now();
    while(S.ota.state!==4&&S.ota.state!==5&&Date.now()-t0<20000)await waitOta(1000);
    if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på stick\'en');
    S.msg='';S.done='Opdatering sendt. Stick\'en genstarter nu.';
  }catch(e){
    S.msg=(e&&e.message)||String(e);
    try{if(S.conn)await S.t.ctrl([OP.ABORT])}catch(x){}
  }
  S.busy=false;render();
}
function paintOta(){
  var b=$('#obar'),t=$('#otxt');if(!b)return;
  var o=S.ota,pct=o.total?Math.floor(o.recv*100/o.total):0;
  b.style.width=pct+'%';
  var el=(Date.now()-(S.t0||Date.now()))/1000,sp=el>0?o.recv/el/1024:0;
  var names=['Klar','Klar','Sender…','Kontrollerer…','Færdig – genstarter','Fejl'];
  t.textContent=names[o.state]+'  '+pct+'%  ('+Math.round(o.recv/1024)+' / '+Math.round(o.total/1024)+' KB'+(sp>0?', '+sp.toFixed(1)+' KB/s':'')+')';
}

// ---------- boot image (128 x 64, 1 bit) ----------
async function loadImage(f){if(!f)return;S.imgFile=f;await rebuildImg();render()}
async function rebuildImg(){
  if(!S.imgFile)return;
  var bmp=await createImageBitmap(S.imgFile),c=document.createElement('canvas');c.width=128;c.height=64;
  var g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,128,64);
  var sc=Math.min(128/bmp.width,64/bmp.height),w=bmp.width*sc,h=bmp.height*sc;g.drawImage(bmp,(128-w)/2,(64-h)/2,w,h);
  var d=g.getImageData(0,0,128,64).data,bits=new Uint8Array(1024);
  for(var y=0;y<64;y++)for(var x=0;x<128;x++){var i=(y*128+x)*4,lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2],on=lum>S.thr;if(S.inv)on=!on;if(on){var b=y*128+x;bits[b>>3]|=0x80>>(b&7)}}
  S.img=bits;paintImg();
}
function paintImg(){
  var cv=$('#imgprev');if(!cv||!S.img)return;var g=cv.getContext('2d'),th=THEMES[S.info?S.info.theme:0];
  g.fillStyle=th.bg;g.fillRect(0,0,240,135);g.fillStyle=th.neon;
  for(var y=0;y<64;y++)for(var x=0;x<128;x++){var b=y*128+x;if(S.img[b>>3]&(0x80>>(b&7)))g.fillRect(56+x,6+y,1,1)}
}
function sendImage(){return act(async function(){
  if(!S.img)throw new Error('Vælg et billede først.');
  S.busy=true;render();
  try{
    await sendAck([OP.IMG_BEGIN]);
    for(var off=0;off<1024;off+=128)await sendAck([OP.IMG_CHUNK,off&255,off>>8].concat(Array.from(S.img.slice(off,off+128))));
    await sendAck([OP.IMG_END]);
    await sendAck([OP.STYLE,2]);
  }finally{S.busy=false}
  await S.t.ctrl([OP.INFO]);
})}

function sig(r){var n=r>-55?4:r>-67?3:r>-78?2:1;return '<span class="sig">'+[1,2,3,4].map(function(i){return '<i class="'+(i<=n?'on':'')+'" style="height:'+(3+i*2.6)+'px"></i>'}).join('')+'</span>'}
function vScooter(){

      chip(st.ble?bsN:'Bluetooth slukket',st.bleState===4?'ok':st.ble?'warn':'')+(st.link?chip(esc(st.link)):'')+(st.demo?chip('Demo er slået til','warn'):'')+'</div>'+

  h+='<div class="card"><h3>Fart pr. køretilstand</h3>'+[2,1,0].map(function(w){var v=st.lim?st.lim[w]:null,mx=st.limMax?st.limMax[w]:30,ok=st.have&&v!=null;

  return h;

function segBtns(act,cur,list){return '<div class="seg'+(list.length===3?' c3':list.length===2?' c2':'')+'">'+list.map(function(n,k){return '<button data-act="'+act+'" data-v="'+k+'" class="'+(cur===k?'sel':'')+'">'+n+'</button>'}).join('')+'</div>'}

    '<p>Tekst (navn på bootskærmen, højst 15 tegn, A–Z):</p><input type="text" id="btext" maxlength="15" value="'+esc(S.text)+'" placeholder="fx MIN TALARIA">'+
    '<div class="row"><button class="btn sec" data-act="text">Gem tekst</button><button class="btn sec" data-act="preview">Vis på stick</button></div></div>';

    tgl('Byt sort/hvid','','inv',S.inv,false)+'<button class="btn" data-act="sendimg"'+(S.busy?' disabled':'')+'>Send billede til stick\'en</button>':'<p class="small">Vælg et billede – det bliver sort/hvidt og vises i temaets farve.</p>')+'</div>';
  return h;
}
function vSystem(){
  var i=S.info||{},st=S.st||{},h='';
  h+='<div class="card"><div class="row" style="align-items:center"><svg style="flex:none;width:70px" viewBox="0 0 70 70"><rect x="15" y="4" width="40" height="62" rx="9" fill="#ff7a1a"/><rect x="20" y="10" width="30" height="34" rx="3" fill="#000"/><text x="35" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">23</text><circle cx="35" cy="54" r="5" fill="#000" opacity=".5"/></svg>'+
    '<div><h2>NOVA RIDE OS</h2><p>'+(i.ver?'Firmware '+esc(i.ver):'')+' · M5 StickS3</p><p class="small">App '+APP_VERSION+'</p></div></div>'+
    '<div class="chips">'+chip('Stick-batteri '+(st.batt!=null?st.batt+'%':'--')+(st.chg?' ⚡':''),st.batt!=null&&st.batt<20?'bad':'')+chip((st.clients||0)+' telefon(er) på Wi-Fi')+chip('Telefon-BT '+(i.flags&4?'forbundet':'ikke forbundet'),i.flags&4?'ok':'')+chip('Opdateringsvindue '+(i.flags&1?'åbent':'lukket'),i.flags&1?'ok':'')+'</div></div>';
  var fi=S.fileInfo;
  h+='<div class="card"><h3>Opdater firmware</h3>'+
    '<div class="step"><em>1</em><div>På stick\'en: <b>MENU → UPDATE</b>, og hold <span class="key">A</span> i 1,5 s, så <b>WINDOW OPEN</b> vises (2 minutter).</div></div>'+
    '<div class="step"><em>2</em><div>Vælg <b>NOVA_RIDE_m5sticks3.bin</b> (ikke <i>.factory.bin</i>).</div></div>'+

    '<input type="file" id="bin" accept=".bin,application/octet-stream">';
  if(fi)h+=kv('Fil',esc(fi.name))+kv('Størrelse',Math.round(fi.size/1024)+' KB')+kv('CRC-32',hex(fi.crc))+(fi.bad?'<p style="color:var(--bad)">'+esc(fi.bad)+'</p>':'<p style="color:var(--ok)">Filen er en gyldig ESP32-S3-firmware.</p>');
  h+='<div class="bar"><i id="obar"></i></div><div class="small" id="otxt">Klar</div>'+(S.done?'<div class="note ok">'+esc(S.done)+'</div>':'')+
    '<button class="btn" data-act="update"'+(S.file&&!S.busy&&(i.flags&1)?'':' disabled')+'>Start opdatering</button>'+
    (S.file&&!(i.flags&1)?'<p class="small">Åbn opdateringsvinduet på stick\'en først.</p>':'')+'</div>';
  h+='<div class="card"><h3>Kode til appen</h3><div class="row" style="align-items:center"><div><b>'+(st.pinSet?'Kode er slået til':'Ingen kode')+'</b><p>'+(st.pinSet?'Alle telefoner skal indtaste koden, før de kan styre stick\'en og løbehjulet.':'Alle på stick\'ens Wi-Fi kan bruge appen.')+'</p></div></div>'+
    '<button class="btn'+(st.pinSet?' sec':'')+'" data-act="pin-set">'+(st.pinSet?'Skift kode':'Sæt kode')+'</button>'+
    (st.pinSet?'<button class="btn bad" data-act="pin-off">Fjern koden</button>':'')+
    (savedPin()?'<p class="small">Koden er husket på denne telefon. <a href="#" data-act="pin-forget" style="color:var(--acc)">Glem den</a></p>':'')+'</div>';
  h+='<div class="card"><h3>Forbindelser</h3>'+
    tgl('Telefon-Bluetooth','Musiktaster og appens reserveforbindelse','phone-set',st.phone,false)+

  h+='<div class="card"><h3>Knapperne på stick\'en</h3>'+

// ---------- events ----------
function closest(el,sel){while(el&&el!==document){if(el.matches&&el.matches(sel))return el;el=el.parentNode}return null}
document.addEventListener('click',function(ev){
  var tb=closest(ev.target,'[data-tab]');
  if(tb){S.tab=tb.dataset.tab;S.msg='';render();if(S.conn&&S.t){if(S.tab==='system')S.t.ctrl([OP.LOG]).catch(function(){});if(S.tab==='scooter')S.t.ctrl([OP.SCAN]).catch(function(){})}window.scrollTo(0,0);return}
  var b=closest(ev.target,'[data-act]');if(!b||b.disabled)return;
  if(closest(ev.target,'[data-stop]')&&!closest(ev.target,'button'))return;
  var a=b.dataset.act,v=+b.dataset.v,st=S.st||{};
  switch(a){
    case 'conn':connect(false);break;
    case 'demo':connect(true);break;
    case 'disc':disconnect();break;
    case 'sheet-no':S.sheet=null;paintSheet();break;
    case 'pk':if(S.pinEntry.length<6){S.pinEntry+=String(v);S.pinErr=''}render();break;
    case 'pk-del':S.pinEntry=S.pinEntry.slice(0,-1);render();break;
    case 'pk-ok':if(S.pinEntry.length>=4){var pe=S.pinEntry,rem=$('#pinrem');S.pinRemember=!rem||rem.checked;login(pe,S.pinRemember).catch(function(e){S.pinErr=e.message||String(e);render()})}else{S.pinErr='Koden har 4–6 cifre';render()}break;
    case 'pin-set':pinSheet();break;
    case 'pin-save':{var a1=$('#pinnew').value,a2=$('#pinnew2').value,rm=$('#pinrem2').checked;
      if(!/^[0-9]{4,6}$/.test(a1)){S.sheet.err='Koden skal være 4–6 cifre';paintSheet();break}
      if(a1!==a2){S.sheet.err='De to koder er ikke ens';paintSheet();break}
      S.sheet=null;paintSheet();act(async function(){await setPin(a1);rememberPin(rm?a1:'')});break}
    case 'pin-off':confirmSheet('Fjern koden?','Så kan alle på stick\'ens Wi-Fi bruge appen og låse løbehjulet op.','Fjern koden',function(){act(async function(){await setPin('');rememberPin('')})},true);break;
    case 'pin-forget':ev.preventDefault();rememberPin('');render();break;
    case 'sticklock-set':setKey(SK.STICKLOCK,!st.stickLock);break;
    case 'd-mph':setDash('mph',v);break;
    case 'd-font':setDash('font',v);break;
    case 'd-col':setDash('col',v);break;
    case 'd-flag':setDash('flags',S.dash.flags^v);break;
    case 'd-page':setDash('pages',S.dash.pages^v);break;
    case 'd-reset':S.dash=dashDefault();setDash();break;
    case 'sheet-ok':var f=S.sheet&&S.sheet.fn;S.sheet=null;paintSheet();if(f)f();break;
    case 'mode':ride(RK.MODE,v);break;
    case 'light':ride(RK.LIGHT,st.light?0:1);break;
    case 'zero':ride(RK.ZERO,st.zero?0:1);break;
    case 'hazard':ride(RK.HAZARD,st.hazard?0:1);break;
    case 'cap':
      if(st.cap===1)confirmSheet('Løft 20 km/t-grænsen?','Grænserne sættes tilbage til, hvad de var før. Det gælder til løbehjulet slukkes. Husk at 20 km/t er grænsen på offentlig vej i Danmark.','Løft for denne tur',function(){ride(RK.CAP,0)});
      else ride(RK.CAP,1);break;
    case 'startcap':act(async function(){await sendAck([OP.START,st.startCap?0:1]);await S.t.ctrl([OP.INFO]);await S.t.ctrl([OP.STATE])});break;
    case 'lock':
      if(st.locked)ride(RK.LOCK,0);
      else confirmSheet('Lås løbehjulet?','Løbehjulet kan ikke køre, før det låses op igen (her eller i MENU → LOCK på stick\'en). Det skal holde stille.','Lås',function(){ride(RK.LOCK,1)},true);break;
    case 'music':act(function(){return sendAck([OP.MUSIC,v])});break;
    case 'demo-set':setKey(SK.DEMO,!st.demo);break;
    case 'ble-set':setKey(SK.BLE,!st.ble);break;
    case 'phone-set':setKey(SK.PHONE,!st.phone);break;
    case 'flip-set':setKey(SK.FLIP,!st.flipped);break;
    case 'pick':{var d=S.scan&&S.scan[v];if(!d)break;
      act(async function(){var e=new TextEncoder();await sendAck([OP.TARGET,d.type].concat(Array.from(e.encode(d.addr)),[0],Array.from(e.encode((d.name||'').replace(/[^\x20-\x7E]/g,'').slice(0,19))),[0]));await sleep(150);await S.t.ctrl([OP.STATE])});break}
    case 'forget-target':confirmSheet('Glem løbehjulet?','Stick\'en afbryder forbindelsen og viser listen over enheder igen.','Glem',function(){act(async function(){await sendAck([OP.TARGET]);S.scan=null;await sleep(150);await S.t.ctrl([OP.STATE])})},true);break;
    case 'lim':{var w=+b.dataset.w,cur=st.lim&&st.lim[w];if(cur==null)break;var nv=cur+(+b.dataset.d);if(nv<6||nv>st.limMax[w])break;ride(RK.LIMIT,w,nv);break}
    case 'theme':act(async function(){await sendAck([OP.THEME,v]);await S.t.ctrl([OP.INFO])});break;
    case 'style':act(async function(){await sendAck([OP.STYLE,v]);await S.t.ctrl([OP.INFO])});break;
    case 'text':act(async function(){var u=Array.from(new TextEncoder().encode(S.text.replace(/[^\x20-\x7E]/g,'').slice(0,15)));await sendAck([OP.TEXT].concat(u));S.textTouched=false;await S.t.ctrl([OP.INFO])});break;
    case 'preview':act(function(){return sendAck([OP.PREVIEW])});break;
    case 'inv':S.inv=!S.inv;rebuildImg().then(render);break;
    case 'sendimg':sendImage();break;
    case 'update':S.done='';startUpdate();break;
    case 'forget-phones':confirmSheet('Glem alle telefoner?','Alle telefoner skal parres igen med NOVA RIDE (musiktaster og Bluetooth-forbindelse).','Glem alle',function(){act(function(){return sendAck([OP.FORGET])})},true);break;
    case 'wifi-off':confirmSheet('Sluk Wi-Fi?','Appen mister forbindelsen. Tænd Wi-Fi igen på stick\'en: MENU → WI-FI.','Sluk Wi-Fi',function(){act(function(){return sendAck([OP.SET,SK.WIFI,0])})},true);break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='btext'){S.text=t.value;S.textTouched=true}
  else if(t.id==='bl'){var l=$('#blv');if(l)l.textContent=t.value+'%'}
  else if(t.id==='thr'){S.thr=+t.value;rebuildImg()}
});
var dashBusy=null;
function setDash(k,v){
  if(k!=null)S.dash[k]=v;
  render();
  clearTimeout(dashBusy);dashBusy=setTimeout(function(){act(async function(){await sendAck([OP.DASH].concat(dashBytes(S.dash)));await S.t.ctrl([OP.DASH])})},150);
}
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(/^dfield[0-2]$/.test(t.id)){S.dash.f[+t.id.slice(6)]=+t.value;setDash();return}
  if(t.id==='bl')act(async function(){await sendAck([OP.BL,+t.value]);await S.t.ctrl([OP.STATE])});
  else if(t.id==='bin')pickFile(t.files&&t.files[0]);
  else if(t.id==='img')loadImage(t.files&&t.files[0]);
  else if(t.id==='accent'){var c=t.value;act(async function(){await sendAck([OP.AC,parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]);await S.t.ctrl([OP.INFO])})}
});
render();
if(BOARD_HOST)connect(false);
window.NOVA_APP={S:S,connect:connect,checkFile:checkFile,onStat:onStat};   // for the tests
})();
</script>
